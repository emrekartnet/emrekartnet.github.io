<section id="skills" class="section bg-gray-50 dark:bg-gray-800">
    <div class="container mx-auto">
        <h2 class="section-title gradient-text">{{ 'sections.technicalSkills' | translate }}</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            @for (category of skillCategories; track category.name) {
            <div class="glass p-6 rounded-xl hover:shadow-xl transition-all duration-300 animate-on-scroll"
                animateOnScroll>
                <div class="flex items-center mb-6">
                    <i [class]="'fas ' + category.icon + ' text-3xl text-primary-500 mr-4'"></i>
                    <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ category.name }}</h3>
                </div>

                <div class="space-y-4">
                    @for (skill of category.skills; track skill.name) {
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-700 dark:text-gray-300 font-medium">{{ skill.name }}</span>
                            <span class="text-sm text-gray-500 dark:text-gray-400">{{ skill.level }}%</span>
                        </div>
                        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 overflow-hidden">
                            <div class="bg-gradient-to-r from-primary-500 to-primary-600 h-2 rounded-full transition-all duration-1000 ease-out"
                                [style.width.%]="skill.level"></div>
                        </div>
                    </div>
                    }
                </div>
            </div>
            }
        </div>
    </div>
</section>
